# Baut eine signierte Release-APK und haengt sie an ein GitHub-Release -
# das Gegenstueck zum TestFlight-Workflow der iOS-App. Einrichtung und
# Installation auf dem Geraet: docs/RELEASE.md.
#
# Startet beim Push eines Tags vX.Y bzw. vX.Y.Z
# (git tag v1.2 && git push origin v1.2) und von Hand
# (Actions -> "Release" -> Run workflow, dann ohne GitHub-Release, nur als
# Artifact).
#
# Version: versionName = Tag ohne "v", versionCode aus der Versionsnummer
# (1.2 -> 10200, 1.2.3 -> 10203). Steigt mit jeder Version, sonst verweigert
# Android das Update, und ein erneuter Lauf desselben Tags ergibt dieselbe
# Nummer.
#
# Neben der APK entsteht das AAB fuer einen spaeteren Weg ueber Google Play
# (docs/RELEASE.md); es haengt mit am Release.
#
# Benoetigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    Keystore-Datei (.jks), base64-kodiert
#   ANDROID_KEYSTORE_PASSWORD  Passwort des Keystores
#   ANDROID_KEY_ALIAS          Alias des Schluessels darin
#   ANDROID_KEY_PASSWORD       Passwort des Schluessels
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version bestimmen
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name=$(sed -n 's/.*versionName = .*?: "\(.*\)".*/\1/p' app/build.gradle.kts)
          fi
          IFS=. read -r major minor patch <<< "$name"
          if ! [[ "$major" =~ ^[0-9]+$ && "${minor:-0}" =~ ^[0-9]+$ && "${patch:-0}" =~ ^[0-9]+$ ]]; then
            echo "::error::Version '$name' ist nicht X.Y oder X.Y.Z"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + ${minor:-0} * 100 + ${patch:-0}))" >> "$GITHUB_OUTPUT"

      - name: Keystore aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt - siehe docs/RELEASE.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signierte Release-APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Keine signierte APK entstanden - Secrets pruefen"
            ls app/build/outputs/apk/release/
            exit 1
          fi
          cp "$apk" "lademonitor-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "lademonitor-${{ steps.version.outputs.name }}.aab"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Changelog-Abschnitt holen
        run: |
          v="${{ steps.version.outputs.name }}"
          # "## 1.2 (2026-10-14)" bis zur naechsten "## "-Zeile; v1.2.0 findet
          # auch einen Abschnitt "## 1.2".
          extract() {
            awk -v v="$1" '
              /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          notes=$(extract "$v")
          [ -z "$notes" ] && notes=$(extract "${v%.0}")
          [ -z "$notes" ] && notes="Siehe CHANGELOG.md."
          printf '%s\n' "$notes" > release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: lademonitor-${{ steps.version.outputs.name }}
          path: |
            lademonitor-*.apk
            lademonitor-*.aab

      - name: GitHub-Release anlegen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Lademonitor ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          # Haengt GitHubs Liste der gemergten Pull Requests an den Changelog-Text.
          generate_release_notes: true
          files: |
            lademonitor-*.apk
            lademonitor-*.aab
